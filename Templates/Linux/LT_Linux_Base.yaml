zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0f6df1ecdeee4638b0f22ac26f1f8fdb
      name: 'Lidorio Tech'
  templates:
    - uuid: 34a42bad3a8542a2be1024acffc7522f
      template: 'LT Linux Base'
      name: 'LT Linux Base'
      description: |
        Template base do Lidorio-Zabbix-Pack para monitoramento de sistemas Linux.
        
        Fornece indicadores comuns de infraestrutura Linux utilizados como fundação para os templates especializados da LIDORIO TECH.
        
        Projeto: Lidorio-Zabbix-Pack
        Template: LT Linux Base
      groups:
        - name: 'Lidorio Tech'
      items:
        - uuid: 434a1e04d6144885b20b63dcf1a9c67c
          name: 'Maximum open files'
          key: kernel.maxfiles
          delay: 1h
          units: files
        - uuid: 5fbdc86757c7461f8bb35460ded8e4f7
          name: 'Maximum number of processes'
          key: kernel.maxproc
          delay: 1h
          units: proc
        - uuid: 546beb8e5c6748ecad61b974ba9cc0bc
          name: 'Open file descriptors'
          key: kernel.openfiles
          units: files
        - uuid: 904c70cd514c4b91bf59a9415db3cd2b
          name: 'Number of processes'
          key: proc.num
          units: proc
        - uuid: 8a9bc91dc1de4f1685b8581a7af7e4be
          name: 'CPU load average (1m)'
          key: 'system.cpu.load[all,avg1]'
          value_type: FLOAT
          units: '-'
          triggers:
            - uuid: e6e6e6e6f7f74a8b9c0c0d1d1e2e2f3f
              expression: 'last(/LT Linux Base/system.cpu.load[all,avg1])>{$LOAD.AVG.HIGH}'
              name: 'CPU load average is too high'
              priority: WARNING
        - uuid: f35641b338a44c999a73b87dcb5fd2f4
          name: 'CPU utilization'
          key: system.cpu.util
          history: 7d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: a1a1a1a1b2b24c3c9d4d4e5e5f6f6a7a
              expression: 'last(/LT Linux Base/system.cpu.util)>{$CPU.UTIL.HIGH}'
              name: 'CPU utilization is too high'
              priority: WARNING
        - uuid: fbc4e98824e54626bd5c12bc1e185cb7
          name: 'System hostname'
          key: system.hostname
          delay: 1h
          value_type: TEXT
          trends: '0'
        - uuid: 1572294a84e24d92be3eca1456e45f3a
          name: 'System architecture'
          key: system.sw.arch
          delay: 1h
          value_type: TEXT
          trends: '0'
        - uuid: c4080dc4929b4bf8a4d4fdecad6299a0
          name: 'Operating system'
          key: system.sw.os
          delay: 1h
          value_type: TEXT
          trends: '0'
        - uuid: 31f66df106024289a2bc235672a00c33
          name: 'Swap free'
          key: 'system.swap.size[,free]'
          units: B
        - uuid: 5867471678cb4003afbc17fa51b397e0
          name: 'Swap utilization'
          key: 'system.swap.size[,pfree]'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: c3c3c3c3d4d44e5e9f6f6a7a7b8b8c9c
              expression: 'last(/LT Linux Base/system.swap.size[,pfree])<(100-{$SWAP.PUSED.HIGH})'
              name: 'Swap utilization is too high'
              priority: WARNING
        - uuid: c02c6575d99442b8ae0e73e3a336f33c
          name: 'Swap total'
          key: 'system.swap.size[,total]'
          delay: 1h
          units: B
        - uuid: 89ae2da7b25e4aba9cd76cc133b41159
          name: 'System uname'
          key: system.uname
          delay: 1h
          value_type: TEXT
          trends: '0'
        - uuid: 9378a42c38e241a5a976abf465964413
          name: 'System uptime'
          key: system.uptime
          delay: 5m
          units: uptime
          triggers:
            - uuid: d4d4d4d4e5e54f6f8a7a7b8b8c9c9d0d
              expression: 'last(/LT Linux Base/system.uptime)<600'
              name: 'Host has been restarted'
              priority: INFO
        - uuid: af54a1ce34e145cbada1e10166263a91
          name: 'Memory available'
          key: 'vm.memory.size[available]'
          units: B
        - uuid: c821b67b41304552bdea32213f52721b
          name: 'Memory available %'
          key: 'vm.memory.size[pavailable]'
          value_type: FLOAT
          units: '%'
        - uuid: f305c10e9888447085e16378679a2d04
          name: 'Memory utilization'
          key: 'vm.memory.size[pused]'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: b2b2b2b2c3c34d4d8e5e5f6f6a7a7b8b
              expression: 'last(/LT Linux Base/vm.memory.size[pused])>{$MEM.PUSED.HIGH}'
              name: 'Memory utilization is too high'
              priority: WARNING
        - uuid: 570416f529564a1aa40fa96e5b579189
          name: 'Memory total'
          key: 'vm.memory.size[total]'
          delay: 1h
          units: B
      discovery_rules:
        - uuid: 8622a30455e644cba9a9c9442880eda9
          name: 'Network interface discovery'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: ^(eth|en|bond|br|vlan)
                formulaid: A
          item_prototypes:
            - uuid: 2c0d6b37c85e4236ac7a03fc502b8781
              name: 'Network interface {#IFNAME} received errors'
              key: 'net.if.in[{#IFNAME},errors]'
              delay: 5m
              units: errors
              trigger_prototypes:
                - uuid: f6f6f6f6a7a74b9c8d1d1e2e2f3f3a4a
                  expression: 'last(/LT Linux Base/net.if.in[{#IFNAME},errors])>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}: High inbound errors'
                  priority: AVERAGE
            - uuid: 059e1a4fb4dd48c3adcba98be6993741
              name: 'Network interface {#IFNAME} received traffic'
              key: 'net.if.in[{#IFNAME}]'
              delay: 3m
              units: Bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
            - uuid: 5e584a834fc643249bcbbde7f81c97e1
              name: 'Network interface {#IFNAME} sent traffic'
              key: 'net.if.out[{#IFNAME}]'
              delay: 3m
              units: Bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
        - uuid: b28f9f6ced2942b88d0960f8b2120d98
          name: 'Filesystem discovery'
          key: vfs.fs.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSTYPE}'
                value: ^(xfs|ext2|ext3|ext4|btrfs|zfs|reiserfs|jfs)$
                formulaid: A
          item_prototypes:
            - uuid: b654fad1118c42738af0ed78f66d7500
              name: 'Filesystem {#FSNAME} free'
              key: 'vfs.fs.size[{#FSNAME},free]'
              delay: 5m
              units: B
            - uuid: 55f1e86f0aed435d92d82a8da5f7cc03
              name: 'Filesystem {#FSNAME} utilization'
              key: 'vfs.fs.size[{#FSNAME},pused]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              trigger_prototypes:
                - uuid: e5e5e5e5f6f64a8b9c2c2d3d3e4e4f5f
                  expression: 'last(/LT Linux Base/vfs.fs.size[{#FSNAME},pused])>{$FS.PUSED.HIGH}'
                  name: 'Filesystem {#FSLABEL} is critically full'
                  priority: HIGH
            - uuid: a89a05584b944b77a751311cef3e5b56
              name: 'Filesystem {#FSNAME} total'
              key: 'vfs.fs.size[{#FSNAME},total]'
              delay: 1h
              units: B
            - uuid: f6a71346b53e4be3ac4a32f86c7bb447
              name: 'Filesystem {#FSNAME} used'
              key: 'vfs.fs.size[{#FSNAME},used]'
              delay: 5m
              units: B
      tags:
        - tag: component
          value: system
        - tag: service
          value: linux
        - tag: target
          value: 'LT Linux Base'
      macros:
        - macro: '{$CPU.UTIL.DISASTER}'
          value: '95'
          description: 'Limiar crítico para utilização de CPU (%).'
        - macro: '{$CPU.UTIL.HIGH}'
          value: '90'
          description: 'Limiar de alerta para utilização de CPU (%).'
        - macro: '{$FS.PUSED.DISASTER}'
          value: '95'
          description: 'Limiar crítico para utilização de Filesystem (%).'
        - macro: '{$FS.PUSED.HIGH}'
          value: '90'
          description: 'Limiar de alerta para utilização de Filesystem (%).'
        - macro: '{$IF.ERRORS.WARN}'
          value: '10'
          description: 'Limiar para erros de interface de rede.'
        - macro: '{$LOAD.AVG.HIGH}'
          value: '5'
          description: 'Limiar de alerta para Load Average (1m).'
        - macro: '{$MEM.PUSED.DISASTER}'
          value: '95'
          description: 'Limiar crítico para memória RAM utilizada (%).'
        - macro: '{$MEM.PUSED.HIGH}'
          value: '90'
          description: 'Limiar de alerta para memória RAM utilizada (%).'
        - macro: '{$SWAP.PUSED.HIGH}'
          value: '50'
          description: 'Limiar de alerta para utilização de Swap (%).'
